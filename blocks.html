<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Bloom · tiny break</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="game-page" data-game="blocks">
  <main class="game-wrap">
    <header class="topbar"><a class="back" href="index.html">← menu</a><button class="new-game" id="newGame" type="button">new game</button></header>
    <h1 class="game-title">Block Bloom</h1>
    <p class="game-subtitle">Drag a shape, then drop it where it should land.</p>
    <p class="reward-info">Earn 20 points for every full row cleared.</p>
    <div class="score-row"><div class="score">SCORE<b id="score">0</b></div><div class="score">BEST<b id="best">0</b></div><div class="score">GAME POINTS<b id="gamePoints">0</b></div></div>
    <section class="game-panel block-layout">
      <div class="block-board" id="blockBoard" aria-label="Block game board"></div>
      <div class="piece-rack" id="pieceRack" aria-label="Available block shapes"></div>
      <p class="block-note" id="blockNote" aria-live="polite">Clear full rows or columns for a little sparkle.</p>
    </section>
    <section class="lose-screen" id="loseScreen" hidden aria-live="assertive">
      <p class="lose-kicker">the board is full</p>
      <h2>you lose</h2>
      <p>No more shapes fit. Give it another bloom?</p>
      <button class="new-game" id="tryAgain" type="button">try again</button>
    </section>
    <p class="hide-hint">Need to look busy? Scroll down.</p>
  </main>
  <section class="hide-zone" aria-label="Blank screen"></section>
  <script src="site.js?v=progress-2"></script>
  <script src="blocks.js?v=bloom-clear-2"></script>
</body>
</html>
