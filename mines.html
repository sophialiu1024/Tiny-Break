<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minefield · tiny break</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="game-page" data-game="mines">
  <main class="game-wrap">
    <header class="topbar"><a class="back" href="index.html">← menu</a><button class="new-game" id="newGame" type="button">new game</button></header>
    <h1 class="game-title">Minefield</h1>
    <p class="game-subtitle">Tap to uncover. Right-click or long-press to flag.</p>
    <p class="reward-info">Earn 100 points for finishing the board.</p>
    <div class="score-row"><div class="score">MINES<b id="minesLeft">40</b></div><div class="score">SAFE TILES<b id="safeLeft">216</b></div><div class="score">GAME POINTS<b id="gamePoints">0</b></div></div>
    <section class="game-panel">
      <div class="mine-board" id="mineBoard" aria-label="16 by 16 Minesweeper board"></div>
      <button class="flag-toggle" id="flagToggle" type="button" aria-pressed="false">⚑ flag mode</button>
      <p class="mine-status" id="mineStatus" aria-live="polite"></p>
    </section>
    <p class="hide-hint">Need to look busy? Scroll down.</p>
  </main>
  <section class="hide-zone" aria-label="Blank screen"></section>
  <script src="site.js?v=progress-2"></script>
  <script src="mines.js"></script>
</body>
</html>
